name: Binance Futures Crypto Scanner (24/7 Cloud)

on:
  schedule:
    # รันสแกนอัตโนมัติบน Cloud ทุกๆ 5 นาที (ไม่ต้องเปิดคอม)
    - cron: '*/5 * * * *'
  workflow_dispatch: # อนุญาตให้กดสั่งรันด้วยมือบน GitHub ได้ตลอดเวลา

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore Cooldown Cache (4 Hours Memory)
        uses: actions/cache/restore@v3
        with:
          path: sent_alerts.json
          key: scanner-cooldown-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            scanner-cooldown-${{ runner.os }}-

      - name: Run Binance Scanner & Alert Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python single_scan.py

      - name: Save Cooldown Cache
        uses: actions/cache/save@v3
        if: always()
        with:
          path: sent_alerts.json
          key: scanner-cooldown-${{ runner.os }}-${{ github.run_id }}
